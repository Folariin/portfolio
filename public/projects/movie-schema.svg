<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fffaf5"/><g font-family="Arial,sans-serif"><text x="64" y="72" fill="#805b3c" font-size="16" letter-spacing="3">MOVIE DATA / RELATIONAL EXPLORATION</text><text x="64" y="133" fill="#29233b" font-size="42" font-weight="600">A story in every relationship.</text><text x="64" y="173" fill="#685c6d" font-size="19">Java + JDBC + Microsoft SQL Server</text><g stroke="#c3af9e" stroke-width="3" fill="none"><path d="M355 315H460M740 315H845"/><circle cx="355" cy="315" r="5" fill="#c3af9e"/><circle cx="845" cy="315" r="5" fill="#c3af9e"/></g><rect x="64" y="231" width="291" height="205" rx="16" fill="#eee7fa"/><rect x="460" y="231" width="280" height="205" rx="16" fill="#f4e5d6"/><rect x="845" y="231" width="291" height="205" rx="16" fill="#e3f0e9"/><g fill="#29233b" font-size="25" font-weight="600"><text x="89" y="275">Movie</text><text x="485" y="275">workedIn</text><text x="870" y="275">People</text></g><g font-family="monospace" font-size="18" fill="#5b5067"><text x="89" y="321">imdb_id</text><text x="89" y="356">title</text><text x="89" y="391">rating</text><text x="485" y="321">imdb_id</text><text x="485" y="356">person_id</text><text x="485" y="391">role</text><text x="870" y="321">person_id</text><text x="870" y="356">name</text><text x="870" y="391">…</text></g><rect x="64" y="475" width="1072" height="178" rx="16" fill="#f4f0ec"/><text x="90" y="514" fill="#805b3c" font-size="14" letter-spacing="2">QUERY / HIGHEST-RATED MOVIES</text><g font-family="monospace" font-size="21"><text x="90" y="554" fill="#6040d8">SELECT TOP (?) Movie.title, Movie.rating</text><text x="90" y="587" fill="#29233b">FROM Movie</text><text x="90" y="620" fill="#29233b">ORDER BY Movie.rating DESC;</text></g></g></svg>